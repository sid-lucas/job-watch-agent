[pytest]
addopts = -p no:langsmith_plugin
testpaths = tests
markers =
    allow_llm_client: the test builds a real LLM client object (never calls it)
    browser: end-to-end tests with a real headless browser on the local trap site (deselect with -m "not browser")
filterwarnings =
    ignore::DeprecationWarning:langsmith.*
